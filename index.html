<script>
    // Importa todos os módulos
    import { CONFIG } from './js/config.js';
    import * as indicadores from './js/indicadores.js';
    import * as dadosExternos from './js/dados_externos.js';
    import * as graficos from './js/graficos.js';
    import * as telegram from './js/telegram.js';
    import * as banco from './js/banco_de_dados.js';
    import * as historico from './js/historicos_sinais.js';

    // ===== Estado global =====
    const assetsData = {};
    CONFIG.ASSETS.forEach(symbol => {
        assetsData[symbol] = {
            price: 0, candles1H: [], candles4H: [], candles1D: [],
            ema50_1H: 0, ema200_4H: 0, rsi_1H: 50, atr_1H: 0,
            atrHistory: [],
            swingHighs: [], swingLows: [], currentBOS: 'NEUTRAL', mtfTrend: 'NEUTRAL',
            oiDelta: 0, volumeRel: 1.0, rsiState: { avgGain: 0, avgLoss: 0, rsi: 50 },
            bbWidth: 0.1,
            volumeAvg: 0,
            currentVolume: 0,
            fundingRate: 0,
            trend4H: 'NEUTRAL',
            trend1D: 'NEUTRAL',
            mvrv: 1.2,
            sopr: 0.95,
            realizedPrice: 53600,
            htfStructure: { bias: 'NEUTRAL', lastSwingHigh: 0, lastSwingLow: Infinity },
            mtfConfluence: null
        };
    });

    let activePositions = {};
    let alertCooldowns = {};
    let liqMap = { 'BTCUSDT': { longs: 0, shorts: 0 }, 'ETHUSDT': { longs: 0, shorts: 0 }, 'SOLUSDT': { longs: 0, shorts: 0 } };
    let liquidationLevels = { 'BTCUSDT': [], 'ETHUSDT': [], 'SOLUSDT': [] };
    let scoreHistory = [];
    let previousScores = { 'BTCUSDT': 50, 'ETHUSDT': 50, 'SOLUSDT': 50 };
    let signalCooldown = {
        lastSignalTime: {},
        lastSignalPrice: {},
        canSignal(symbol, currentPrice) {
            const now = Date.now();
            const lastTime = this.lastSignalTime[symbol] || 0;
            const lastPrice = this.lastSignalPrice[symbol] || 0;
            if (now - lastTime < CONFIG.SIGNAL_COOLDOWN_MS) {
                const priceChange = Math.abs(currentPrice - lastPrice) / lastPrice;
                if (priceChange < CONFIG.PRICE_THRESHOLD) return false;
            }
            return true;
        },
        recordSignal(symbol, price) {
            this.lastSignalTime[symbol] = Date.now();
            this.lastSignalPrice[symbol] = price;
        }
    };

    // ===== DOM references =====
    const DOM = {};
    function cacheDOM() {
        const ids = ['btc-price', 'eth-price', 'sol-price', 'btc-change', 'eth-change', 'sol-change', 
                     'score-value', 'score-bar', 'last-update', 'header-timestamp', 'status-badge', 'ws-status'];
        ids.forEach(id => DOM[id] = document.getElementById(id));
    }

    // ===== Funções auxiliares =====
    function getCurrentTimestamp() {
        const now = new Date();
        return now.toLocaleString('pt-BR', {
            year: 'numeric', month: 'short', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            timeZone: 'America/Sao_Paulo'
        });
    }

    function formatCurrency(value) {
        return '$' + Number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateSourceTimestamp(elementId) {
        const el = document.getElementById(elementId);
        if (el) {
            const currentText = el.textContent;
            if (currentText.includes('•')) {
                el.textContent = currentText.replace(/•.*$/, '• ' + getCurrentTimestamp());
            } else {
                el.textContent = currentText + ' • ' + getCurrentTimestamp();
            }
        }
    }

    // ===== Atualização de UI =====
    function updateLivePriceUI(symbol, price) {
        const prefix = symbol.replace('USDT', '').toLowerCase();
        const el = DOM[`${prefix}-price`] || document.getElementById(`${prefix}-price`);
        if (el) {
            const oldPrice = parseFloat(el.textContent.replace(/[^0-9.-]/g, ''));
            el.textContent = formatCurrency(price);
            if (!isNaN(oldPrice) && price !== oldPrice) {
                el.style.transition = 'color 0.3s, background 0.3s';
                const color = price > oldPrice ? 'var(--accent-green)' : 'var(--accent-red)';
                el.style.color = color;
                el.style.background = price > oldPrice ? 'rgba(0, 232, 150, 0.1)' : 'rgba(255, 77, 109, 0.1)';
                setTimeout(() => { el.style.color = ''; el.style.background = ''; }, 300);
            }
        }
    }

    function updateMainScoreUI(scoreData, blockReason) {
        const s = scoreData.score;
        const c = scoreData.components;
        const scoreEl = DOM['score-value'] || document.getElementById('score-value');
        const barEl = DOM['score-bar'] || document.getElementById('score-bar');
        if (scoreEl) scoreEl.textContent = s;
        if (barEl) {
            barEl.style.width = s + '%';
            barEl.style.background = s >= 75 ? 'var(--accent-green)' : s <= 25 ? 'var(--accent-red)' : 'var(--accent-yellow)';
        }
        if (scoreEl) scoreEl.style.color = s >= 75 ? 'var(--accent-green)' : s <= 25 ? 'var(--accent-red)' : 'var(--accent-yellow)';
        document.getElementById('score-trend').textContent = c.mtf;
        document.getElementById('score-structure').textContent = c.smc;
        document.getElementById('score-momentum').textContent = c.mom;
        document.getElementById('score-volume').textContent = c.of;
        document.getElementById('score-onchain').textContent = c.macro;
        document.getElementById('score-oi').textContent = c.oi;
        const reasonEl = document.getElementById('block-reason');
        if (blockReason) { reasonEl.style.display = 'block'; reasonEl.textContent = '🚫 ' + blockReason; } 
        else { reasonEl.style.display = 'none'; }
    }

    function updateActiveTradesUI() {
        CONFIG.ASSETS.forEach(symbol => {
            const id = symbol.toLowerCase();
            const el = document.getElementById(`trade-${id}`);
            if (!el) return;
            const pos = activePositions[symbol];
            if (pos) {
                const currentPrice = assetsData[symbol].price;
                let pnl = 0, pnlPercent = 0;
                if (pos.type === 'LONG') {
                    pnl = (currentPrice - pos.entryPrice) * pos.sizeRemaining;
                    pnlPercent = ((currentPrice - pos.entryPrice) / pos.entryPrice) * 100;
                } else {
                    pnl = (pos.entryPrice - currentPrice) * pos.sizeRemaining;
                    pnlPercent = ((pos.entryPrice - currentPrice) / pos.entryPrice) * 100;
                }
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                const statusTxt = pos.partialTaken ? 'PARCIAL (50%)' : 'EM POSSE';
                el.className = `trade-item ${pos.type.toLowerCase()}`;
                el.innerHTML = `
                    <div class="trade-title">${symbol} <span style="font-size:0.8em; opacity:0.7;">(${pos.type} - ${statusTxt})</span></div>
                    <div class="trade-details">Entry: $${pos.entryPrice.toFixed(2)} | Trail: $${pos.trailingStop.toFixed(2)} | TP1: $${pos.tp1.toFixed(2)}</div>
                    <div class="trade-pnl ${pnlClass}">PnL: $${pnl.toFixed(2)} (${pnlPercent.toFixed(2)}%)</div>
                `;
            } else {
                el.className = 'trade-item';
                el.innerHTML = `<div class="trade-title">${symbol}</div><div class="trade-details">Aguardando sinal...</div>`;
            }
        });
    }

    function updateTimestamps() {
        const ts = getCurrentTimestamp();
        const headerEl = DOM['header-timestamp'] || document.getElementById('header-timestamp');
        if (headerEl) headerEl.textContent = '📅 ' + ts;
        const lastEl = DOM['last-update'] || document.getElementById('last-update');
        if (lastEl) lastEl.textContent = ts;
        document.getElementById('live-update-time').textContent = ts;
        const badge = document.getElementById('status-badge');
        if (badge) { badge.textContent = '✅ LIVE'; badge.className = 'status-badge live'; }
    }

    function updateAnalysisScores() {
        const data = assetsData['BTCUSDT'];
        if (!data || !data.price || data.price === 0) return;
        const atrPct = (data.atr_1H / data.price) * 100;
        let riskScore = Math.min(100, Math.round(30 + atrPct * 8));
        riskScore = Math.max(10, Math.min(100, riskScore));
        document.getElementById('risk-score').textContent = riskScore + '/100';
        document.getElementById('risk-fill').style.width = riskScore + '%';
        let confidence = 50;
        const conf = data.mtfConfluence;
        if (conf && conf.alinhado) confidence += 20;
        if (data.currentBOS !== 'NEUTRAL') confidence += 15;
        if (data.rsi_1H > 30 && data.rsi_1H < 70) confidence += 10;
        confidence = Math.min(100, Math.round(confidence));
        document.getElementById('confidence-score').textContent = confidence + '/100';
        document.getElementById('confidence-fill').style.width = confidence + '%';
        const mainScore = previousScores['BTCUSDT'] || 50;
        document.getElementById('entry-score').textContent = mainScore + '/100';
        document.getElementById('entry-fill').style.width = mainScore + '%';
        let exitScore = 50;
        if (data.rsi_1H > 70) exitScore += 20;
        if (data.rsi_1H < 30) exitScore -= 20;
        if (data.fundingRate > 0.01) exitScore += 10;
        if (data.fundingRate < -0.01) exitScore -= 10;
        exitScore = Math.min(100, Math.max(0, Math.round(exitScore)));
        document.getElementById('exit-score').textContent = exitScore + '/100';
        document.getElementById('exit-fill').style.width = exitScore + '%';
        const badge = document.getElementById('conviction-badge');
        if (mainScore >= 65) {
            badge.textContent = '🟢 BULLISH CONVICTION';
            badge.className = 'conviction-badge conviction-bullish';
        } else if (mainScore <= 35) {
            badge.textContent = '🔴 BEARISH CONVICTION';
            badge.className = 'conviction-badge conviction-bearish';
        } else {
            badge.textContent = '⚪ NEUTRAL CONVICTION';
            badge.className = 'conviction-badge';
            badge.style.background = 'rgba(139,148,158,0.1)';
            badge.style.color = '#8b949e';
            badge.style.border = '1px solid rgba(139,148,158,0.3)';
        }
        const cycleEl = document.getElementById('onchain-cycle');
        const mvrv = data.mvrv || 1.2;
        if (mvrv > 2.5) {
            cycleEl.textContent = '📈 Ciclo: DISTRIBUIÇÃO';
            cycleEl.style.color = 'var(--accent-red)';
        } else if (mvrv < 1.0) {
            cycleEl.textContent = '📉 Ciclo: ACUMULAÇÃO';
            cycleEl.style.color = 'var(--accent-green)';
        } else {
            cycleEl.textContent = '📊 Ciclo: NEUTRO';
            cycleEl.style.color = 'var(--accent-yellow)';
        }
    }

    // ===== Funções de gestão de posições =====
    function closePosition(symbol, reason, isWin) {
        const pos = activePositions[symbol];
        if (!pos) return;
        if (isWin) {
            const stats = historico.getTradeStatsSummary();
            stats.wins++;
            banco.setTradeStats(stats);
        } else {
            const stats = historico.getTradeStatsSummary();
            stats.losses++;
            banco.setTradeStats(stats);
        }
        telegram.sendTelegramAlert(`${isWin ? '✅' : '❌'} <b>POSIÇÃO FECHADA (${symbol})</b>\nMotivo: ${reason}\nWinrate Atual: ${historico.getWinrate().toFixed(1)}%`);
        delete activePositions[symbol];
    }

    function checkPositionManagement(symbol, currentPrice) {
        const pos = activePositions[symbol];
        if (!pos) return;
        const data = assetsData[symbol];
        let updateUI = false;
        if (pos.type === 'LONG') {
            if (data.swingLows.length > 0) {
                const lastSwingLow = Math.min(...data.swingLows);
                let newTrail = lastSwingLow - (data.atr_1H * 0.2);
                if (data.atrHistory && data.atrHistory.length > 20) {
                    const avgATR = data.atrHistory.slice(-20).reduce((a,b)=>a+b,0)/20;
                    if (data.atr_1H > avgATR * 1.5) newTrail -= data.atr_1H * 0.1;
                    else if (data.atr_1H < avgATR * 0.7) newTrail += data.atr_1H * 0.1;
                }
                if (newTrail > pos.trailingStop) {
                    pos.trailingStop = newTrail;
                    telegram.sendTelegramAlert(`📈 <b>TRAILING STOP AJUSTADO (${symbol})</b>\nNovo Stop: $${newTrail.toFixed(2)} (Swing Low + ATR Adaptativo)`);
                }
            }
            if (currentPrice >= pos.tp1 && !pos.partialTaken) {
                pos.partialTaken = true;
                pos.sizeRemaining = 0.5;
                pos.realizedPNL = (pos.tp1 - pos.entryPrice) * 0.5;
                pos.trailingStop = pos.entryPrice + (data.atr_1H * 0.1);
                pos.movedToBE = true;
                telegram.sendTelegramAlert(`🎯 <b>TP1 PARCIAL (${symbol})</b>\n50% realizado em $${pos.tp1.toFixed(2)}\nRestante com trailing ativo (BE+${(data.atr_1H*0.1).toFixed(2)})`);
                updateUI = true;
            }
            if (currentPrice >= pos.tp2) {
                closePosition(symbol, 'TP2 ATINGIDO', true);
                updateUI = true;
            } else if (currentPrice <= pos.trailingStop) {
                const reason = pos.movedToBE ? 'Trailing Stop/Breakeven' : 'Stop Loss Inicial';
                closePosition(symbol, reason, pos.movedToBE);
                updateUI = true;
            }
        } else if (pos.type === 'SHORT') {
            if (data.swingHighs.length > 0) {
                const lastSwingHigh = Math.max(...data.swingHighs);
                let newTrail = lastSwingHigh + (data.atr_1H * 0.2);
                if (data.atrHistory && data.atrHistory.length > 20) {
                    const avgATR = data.atrHistory.slice(-20).reduce((a,b)=>a+b,0)/20;
                    if (data.atr_1H > avgATR * 1.5) newTrail += data.atr_1H * 0.1;
                    else if (data.atr_1H < avgATR * 0.7) newTrail -= data.atr_1H * 0.1;
                }
                if (newTrail < pos.trailingStop || pos.trailingStop === 0) {
                    pos.trailingStop = newTrail;
                    telegram.sendTelegramAlert(`📉 <b>TRAILING STOP AJUSTADO (${symbol})</b>\nNovo Stop: $${newTrail.toFixed(2)}`);
                }
            }
            if (currentPrice <= pos.tp1 && !pos.partialTaken) {
                pos.partialTaken = true;
                pos.sizeRemaining = 0.5;
                pos.realizedPNL = (pos.entryPrice - pos.tp1) * 0.5;
                pos.trailingStop = pos.entryPrice - (data.atr_1H * 0.1);
                pos.movedToBE = true;
                telegram.sendTelegramAlert(`🎯 <b>TP1 PARCIAL (${symbol})</b>\n50% realizado em $${pos.tp1.toFixed(2)}\nRestante com trailing ativo (BE-${(data.atr_1H*0.1).toFixed(2)})`);
                updateUI = true;
            }
            if (currentPrice <= pos.tp2) {
                closePosition(symbol, 'TP2 ATINGIDO', true);
                updateUI = true;
            } else if (currentPrice >= pos.trailingStop) {
                const reason = pos.movedToBE ? 'Trailing Stop/Breakeven' : 'Stop Loss Inicial';
                closePosition(symbol, reason, pos.movedToBE);
                updateUI = true;
            }
        }
        if (updateUI) updateActiveTradesUI();
    }

    // ===== Main loop de avaliação =====
    async function evaluateMarkets() {
        for (const symbol of CONFIG.ASSETS) {
            try {
                const conf = await dadosExternos.getMTFConfluence(symbol);
                if (assetsData[symbol]) assetsData[symbol].mtfConfluence = conf;
            } catch(e) { /* ignore */ }
            try {
                const fr = await dadosExternos.fetchFundingRate(symbol);
                if (fr && assetsData[symbol]) assetsData[symbol].fundingRate = fr.rate;
            } catch(e) { /* ignore */ }
            try {
                const oi = await dadosExternos.fetchOpenInterest(symbol);
                if (oi && assetsData[symbol]) assetsData[symbol].oiDelta = oi.delta;
            } catch(e) { /* ignore */ }
        }

        CONFIG.ASSETS.forEach(symbol => {
            const data = assetsData[symbol];
            indicadores.updateSwingPoints(data);
            const scoreData = indicadores.computeScore(symbol, assetsData, liqMap);
            const score = scoreData.score;
            const blockReason = scoreData.blockReason;
            scoreHistory.push({ time: getCurrentTimestamp().split(' ')[1], symbol: symbol, score: score });
            if (scoreHistory.length > 150) scoreHistory.shift();
            if (symbol === 'BTCUSDT') {
                updateMainScoreUI(scoreData, blockReason);
            }
            const prevScore = previousScores[symbol] || 50;
            if (!activePositions[symbol] && !blockReason && indicadores.isSafeToTrade(assetsData)) {
                const now = Date.now();
                const cooldown = alertCooldowns[symbol] || 0;
                if (now - cooldown > 1800000 && signalCooldown.canSignal(symbol, data.price)) {
                    const atr = data.atr_1H || (data.price * 0.02);
                    const primaryDirection = (score >= 70) ? 'LONG' : (score <= 30 ? 'SHORT' : null);
                    if (primaryDirection) {
                        const expCheck = indicadores.checkPortfolioExposure(activePositions, primaryDirection);
                        if (expCheck.blocked) return;
                        let stop, tp1, tp2, structLevel;
                        if (primaryDirection === 'LONG') {
                            structLevel = Math.min(...data.swingLows) - (atr * 0.3);
                            stop = Math.min(structLevel, data.price - atr * 1.5);
                            tp1 = data.price + (atr * 2);
                            tp2 = data.price + (atr * 4);
                        } else {
                            structLevel = Math.max(...data.swingHighs) + (atr * 0.3);
                            stop = Math.max(structLevel, data.price + atr * 1.5);
                            tp1 = data.price - (atr * 2);
                            tp2 = data.price - (atr * 4);
                        }
                        const rr1 = primaryDirection === 'LONG' ? (tp1 - data.price) / (data.price - stop) : (data.price - tp1) / (stop - data.price);
                        if (rr1 < 1.5) return;
                        if (primaryDirection === 'LONG' && indicadores.findSMCSetup(data, 'LONG')) {
                            const riskPct = indicadores.KellyPositionSize(historico.getWinrate()/100, rr1);
                            telegram.sendTradeAlert(symbol, 'long', score, data.price, stop, [{price: tp1, rr: rr1}, {price: tp2, rr: rr1*2}], `MTF Long + BOS Bullish + SMC Setup`, riskPct, null);
                            activePositions[symbol] = { type: 'LONG', entryPrice: data.price, stop: stop, tp1: tp1, tp2: tp2, movedToBE: false, trailingStop: stop, partialTaken: false, sizeRemaining: 1, realizedPNL: 0 };
                            historico.addAlert(symbol, 'long', score, data.price);
                            updateActiveTradesUI();
                        } else if (primaryDirection === 'SHORT' && indicadores.findSMCSetup(data, 'SHORT')) {
                            const riskPct = indicadores.KellyPositionSize(historico.getWinrate()/100, rr1);
                            telegram.sendTradeAlert(symbol, 'short', score, data.price, stop, [{price: tp1, rr: rr1}, {price: tp2, rr: rr1*2}], `MTF Short + BOS Bearish + SMC Setup`, riskPct, null);
                            activePositions[symbol] = { type: 'SHORT', entryPrice: data.price, stop: stop, tp1: tp1, tp2: tp2, movedToBE: false, trailingStop: stop, partialTaken: false, sizeRemaining: 1, realizedPNL: 0 };
                            historico.addAlert(symbol, 'short', score, data.price);
                            updateActiveTradesUI();
                        }
                    }
                }
            }
            if (prevScore < 50 && score >= 50) {
                telegram.sendTelegramAlert(`🔄 <b>TENDÊNCIA MUDOU (${symbol})</b>\nScore subiu para ${score}. Possível reversão Long.`);
            }
            if (prevScore > 50 && score <= 50) {
                telegram.sendTelegramAlert(`🔄 <b>TENDÊNCIA MUDOU (${symbol})</b>\nScore caiu para ${score}. Possível reversão Short.`);
            }
            previousScores[symbol] = score;
        });
        graficos.updateScoreChart(scoreHistory);
        updateAnalysisScores();
        graficos.updateScenarios(previousScores['BTCUSDT']);
        graficos.updateAllocation((assetsData['BTCUSDT'].atr_1H / assetsData['BTCUSDT'].price) * 100);
    }

    // ===== WebSocket =====
    function initWebSockets() {
        const wsStatusEl = document.getElementById('ws-status') || document.querySelector('.live-indicator');
        const streams = CONFIG.ASSETS.map(a => a.toLowerCase() + '@trade').join('/');
        const ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
        ws.onopen = () => {
            if(wsStatusEl) { wsStatusEl.textContent = '🔄 WEBSOCKET LIVE'; wsStatusEl.style.color = 'var(--accent-green)'; wsStatusEl.style.animation = 'pulse-dot 1.5s infinite'; }
        };
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const symbol = msg.data.s;
            const price = parseFloat(msg.data.p);
            if (assetsData[symbol]) {
                const prevPrice = assetsData[symbol].price;
                assetsData[symbol].price = price;
                if (prevPrice > 0) {
                    assetsData[symbol].ema50_1H = indicadores.updateStatefulEMA(assetsData[symbol].ema50_1H, price, 50);
                    assetsData[symbol].ema200_4H = indicadores.updateStatefulEMA(assetsData[symbol].ema200_4H, price, 200);
                    assetsData[symbol].rsiState = indicadores.updateStatefulRSI(assetsData[symbol].rsiState, price, prevPrice);
                    assetsData[symbol].rsi_1H = assetsData[symbol].rsiState.rsi;
                }
                checkPositionManagement(symbol, price);
                updateLivePriceUI(symbol, price);
            }
        };
        ws.onerror = (e) => {
            console.error("WS Error", e);
            if(wsStatusEl) { wsStatusEl.textContent = '❌ WS OFFLINE'; wsStatusEl.style.color = 'var(--accent-red)'; wsStatusEl.style.animation = 'none'; }
        };
        ws.onclose = () => {
            if(wsStatusEl) { wsStatusEl.textContent = '🔄 RECONNECTING...'; wsStatusEl.style.color = 'var(--accent-yellow)'; wsStatusEl.style.animation = 'none'; }
            setTimeout(initWebSockets, 3000);
        };
        const wsLiq = new WebSocket('wss://fstream.binance.com/ws/!forceOrder@arr');
        wsLiq.onmessage = (event) => {
            const orders = JSON.parse(event.data);
            orders.forEach(o => {
                const symbol = o.order.symbol;
                if (liqMap[symbol]) {
                    const side = o.order.side;
                    const price = parseFloat(o.order.price);
                    const qty = parseFloat(o.order.origQty) * price;
                    if (side === 'BUY') liqMap[symbol].longs += qty;
                    else liqMap[symbol].shorts += qty;
                    if (!liquidationLevels[symbol]) liquidationLevels[symbol] = [];
                    liquidationLevels[symbol].push(price);
                    if (liquidationLevels[symbol].length > 100) liquidationLevels[symbol].shift();
                }
            });
        };
        wsLiq.onclose = () => setTimeout(initWebSockets, 5000);
        setInterval(() => { Object.keys(liqMap).forEach(k => liqMap[k] = { longs: 0, shorts: 0 }); }, 4 * 60 * 60 * 1000);
    }

    // ===== Atualiza dados externos periodicamente =====
async function updateExternalData() {
    try {
        // CoinMetrics
        const coinMetrics = await dadosExternos.fetchCoinMetrics();
        if (coinMetrics) {
            assetsData['BTCUSDT'].mvrv = coinMetrics.price / coinMetrics.realized;
            assetsData['BTCUSDT'].realizedPrice = coinMetrics.realized;
            document.getElementById('mvrv').textContent = (coinMetrics.price / coinMetrics.realized).toFixed(2) + ' (live)';
            document.getElementById('realized-price').textContent = '$' + coinMetrics.realized.toLocaleString('en-US', {maximumFractionDigits: 0}) + ' (live)';
            document.getElementById('exchange-netflow').textContent = (coinMetrics.netflow >= 0 ? '+' : '') + (coinMetrics.netflow / 1e6).toFixed(2) + ' BTC (live)';
            document.getElementById('miner-outflow').textContent = (coinMetrics.minerOutflow / 1e6).toFixed(2) + ' BTC (live)';
        }

        // Blockchair
        const blockchair = await dadosExternos.fetchBlockchairStats();
        if (blockchair) {
            document.getElementById('active-addresses').textContent = blockchair.activeAddresses.toLocaleString() + ' (live)';
            document.getElementById('eth-gas').textContent = blockchair.ethGas.toFixed(2) + ' Gwei (live)';
        }

        // Hashrate
        const hr = await dadosExternos.fetchHashrate();
        if (hr !== null) document.getElementById('btc-hashrate').textContent = hr.toFixed(2) + ' EH/s (live)';

        // ETF
        const etf = await dadosExternos.fetchETFData();
        if (etf) {
            document.getElementById('etf-btc-live').innerHTML = '<strong>' + (etf.btcFlow >= 0 ? '+' : '') + '$' + etf.btcFlow.toFixed(2) + 'M</strong>';
            document.getElementById('etf-eth-live').innerHTML = '<strong>' + (etf.ethFlow >= 0 ? '+' : '') + '$' + etf.ethFlow.toFixed(2) + 'M</strong>';
        }

        // Tether Premium (CORRIGIDO)
        const premium = await dadosExternos.fetchTetherPremium();
        if (premium !== null) {
            const el = document.getElementById('tether-premium');
            el.textContent = (premium >= 0 ? '+' : '') + premium.toFixed(2) + '%';
            el.className = 'value ' + (premium > 0 ? 'positive' : 'negative');
        }

        // Fed Rate (CORRIGIDO)
        const fed = await dadosExternos.fetchFedRate();
        if (fed !== null) {
            document.getElementById('fed-rate').textContent = fed.toFixed(2) + '% (live)';
            document.getElementById('fed-interp').textContent = fed > 4.5 ? '⚠️ Juros restritivos' : 'ℹ️ Juros moderados';
        }

        // Put/Call
        const pcr = await dadosExternos.fetchPutCallRatio();
        if (pcr !== null) {
            document.getElementById('put-call-ratio').textContent = pcr.toFixed(3);
            document.getElementById('put-call-interp').textContent = pcr > 1.2 ? '🟢 Proteção alta' : pcr < 0.6 ? '⚠️ Proteção baixa' : 'ℹ️ Neutro';
        }

        // Basis
        const basis = await dadosExternos.fetchBasis();
        if (basis !== null) document.getElementById('basis').textContent = (basis >= 0 ? '+' : '') + basis.toFixed(2) + '%';

        // Long/Short
        const ls = await dadosExternos.fetchLSRatio();
        if (ls) {
            document.getElementById('ls-ratio-pos').textContent = ls.long.toFixed(1) + '% / ' + ls.short.toFixed(1) + '%';
        }

        // DeFi (CORRIGIDO com fallback cache)
        const defi = await dadosExternos.fetchDeFiData();
        if (defi) {
            document.getElementById('stablecoin-supply').textContent = '$' + defi.totalStable.toFixed(0) + 'B (live)';
            document.getElementById('defi-tvl').textContent = '$' + defi.tvl.toFixed(1) + 'B (live)';
            document.getElementById('defi-tvl-change').textContent = (defi.tvlChange >= 0 ? '+' : '') + defi.tvlChange.toFixed(2) + '%';
            // Guarda em cache
            dadosExternos.setCachedData('defi_fallback', defi);
        } else {
            // Tenta usar cache
            const cachedDefi = dadosExternos.getCachedData('defi_fallback');
            if (cachedDefi) {
                document.getElementById('stablecoin-supply').textContent = '$' + cachedDefi.totalStable.toFixed(0) + 'B (cached)';
                document.getElementById('defi-tvl').textContent = '$' + cachedDefi.tvl.toFixed(1) + 'B (cached)';
                document.getElementById('defi-tvl-change').textContent = (cachedDefi.tvlChange >= 0 ? '+' : '') + cachedDefi.tvlChange.toFixed(2) + '%';
            }
        }

        // Yahoo Macro
        const macroSymbols = ['DX-Y.NYB', '^TNX', '^VIX', '^IXIC', '^GSPC'];
        const macroIds = ['dxy-value', 'us10y-value', 'vix-value', 'nasdaq-value', 'sp500-value'];
        const macroUpdateIds = ['dxy-update', 'us10y-update', 'vix-update', 'nasdaq-update', 'sp500-update'];
        const macroInterps = ['dxy-interp', 'us10y-interp', 'vix-interp'];
        for (let i = 0; i < macroSymbols.length; i++) {
            const yahoo = await dadosExternos.fetchYahoo(macroSymbols[i]);
            if (yahoo) {
                const el = document.getElementById(macroIds[i]);
                const updateEl = document.getElementById(macroUpdateIds[i]);
                if (el) {
                    if (i === 1) { // US10Y
                        el.textContent = (yahoo.price * 100).toFixed(2) + '%';
                    } else if (i === 3 || i === 4) { // NASDAQ/SP500
                        el.textContent = (yahoo.change >= 0 ? '+' : '') + yahoo.change.toFixed(2) + '%';
                        el.style.color = yahoo.change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                    } else {
                        el.textContent = yahoo.price.toFixed(2);
                    }
                }
                if (updateEl) updateEl.textContent = 'atualizado ' + getCurrentTimestamp();
                if (i < 3) {
                    const interpEl = document.getElementById(macroInterps[i]);
                    if (interpEl) {
                        if (i === 0) interpEl.textContent = yahoo.price > 105 ? '🔴 USD Forte' : yahoo.price < 100 ? '🟢 USD Fraco' : 'ℹ️ USD Neutro';
                        if (i === 1) interpEl.textContent = yahoo.price * 100 > 4.5 ? '⚠️ Yields elevados' : yahoo.price * 100 < 3.0 ? '✅ Yields baixos' : 'ℹ️ Yields moderados';
                        if (i === 2) interpEl.textContent = yahoo.price > 25 ? '🔴 Estresse' : yahoo.price < 15 ? '🟢 Calmo' : 'ℹ️ Neutro';
                    }
                }
            }
        }

        // Fear & Greed
        const fg = await dadosExternos.fetchFearGreed();
        if (fg) {
            document.getElementById('header-fng').innerHTML = '😱 FEAR & GREED: ' + fg.value + ' (' + fg.classification + ')';
            document.getElementById('header-sentiment').textContent = fg.value <= 25 ? '⚠️ PESSIMISTA' : '✅ BULLISH';
        }
    } catch(e) {
        console.warn('Erro ao atualizar dados externos:', e);
    }
}
    // ===== Inicialização =====
    async function init() {
        cacheDOM();
        updateTimestamps();
        graficos.initCharts();
        const candleBTC = graficos.initCandleChart('candle-btc', '#00e896');
        const candleETH = graficos.initCandleChart('candle-eth', '#00b4d8');
        const candleSOL = graficos.initCandleChart('candle-sol', '#ffd60a');
        const candleCharts = { 'BTCUSDT': candleBTC, 'ETHUSDT': candleETH, 'SOLUSDT': candleSOL };

        // Warm-up dos dados
        for (const symbol of CONFIG.ASSETS) {
            const [c1H, c4H, c1D] = await Promise.all([
                dadosExternos.fetchHistoricalCandles(symbol, '1h', 200),
                dadosExternos.fetchHistoricalCandles(symbol, '4h', 210),
                dadosExternos.fetchHistoricalCandles(symbol, '1d', 210)
            ]);
            assetsData[symbol].candles1H = c1H;
            assetsData[symbol].candles4H = c4H;
            assetsData[symbol].candles1D = c1D;
            if (c1H.length > 0) {
                const closes = c1H.map(c => c.close);
                const highs = c1H.map(c => c.high);
                const lows = c1H.map(c => c.low);
                assetsData[symbol].price = closes.at(-1);
                assetsData[symbol].ema50_1H = closes.slice(-50).reduce((a,b)=>a+b,0) / 50;
                assetsData[symbol].ema200_4H = closes.slice(-200).reduce((a,b)=>a+b,0) / 200;
                assetsData[symbol].atr_1H = indicadores.calculateATR(c1H, 14);
                const atrHist = [];
                for (let i = 14; i < highs.length; i++) {
                    const slice = c1H.slice(i-14, i);
                    atrHist.push(indicadores.calculateATR(slice, 14));
                }
                assetsData[symbol].atrHistory = atrHist.slice(-50);
                let gains = 0, losses = 0;
                for(let i=1; i<15; i++) { const d = closes[i]-closes[i-1]; if(d>0) gains+=d; else losses-=d; }
                assetsData[symbol].rsiState = { avgGain: gains/14, avgLoss: losses/14, rsi: 50 };
                const bb = indicadores.calculateBB(assetsData[symbol], 20, 2);
                assetsData[symbol].bbWidth = bb.bbWidth;
                const vols = c1H.map(c => c.volume);
                assetsData[symbol].volumeAvg = vols.slice(-20).reduce((a,b)=>a+b,0)/20;
                assetsData[symbol].currentVolume = vols.at(-1) || 0;
                if (c4H.length > 0) {
                    const closes4H = c4H.map(c => c.close);
                    const ema200_4H = closes4H.slice(-200).reduce((a,b)=>a+b,0)/200;
                    assetsData[symbol].trend4H = closes4H.at(-1) > ema200_4H ? 'LONG' : 'SHORT';
                    assetsData[symbol].htfStructure = indicadores.detectHTFStructure(assetsData[symbol], c4H);
                }
                if (c1D.length > 0) {
                    const closes1D = c1D.map(c => c.close);
                    const ema200_1D = closes1D.slice(-200).reduce((a,b)=>a+b,0)/200;
                    assetsData[symbol].trend1D = closes1D.at(-1) > ema200_1D ? 'LONG' : 'SHORT';
                }
            }
        }

        // Inicializa WebSocket
        initWebSockets();

        // Carrega dados externos
        await updateExternalData();

        // Avalia mercados
        await evaluateMarkets();
        updateActiveTradesUI();

        // Atualiza dados externos a cada 2 minutos
        setInterval(updateExternalData, 120000);

        // Atualiza candles a cada 5 minutos
        setInterval(async () => {
            for (const symbol of CONFIG.ASSETS) {
                const c1H = await dadosExternos.fetchHistoricalCandles(symbol, '1h', 10);
                if(c1H.length > 0) {
                    assetsData[symbol].candles1H = [...assetsData[symbol].candles1H.slice(0, -10), ...c1H];
                    const closes = assetsData[symbol].candles1H.map(c => c.close);
                    const highs = assetsData[symbol].candles1H.map(c => c.high);
                    const lows = assetsData[symbol].candles1H.map(c => c.low);
                    const atrHist = [];
                    for (let i = 14; i < highs.length; i++) {
                        const slice = assetsData[symbol].candles1H.slice(i-14, i);
                        atrHist.push(indicadores.calculateATR(slice, 14));
                    }
                    assetsData[symbol].atrHistory = atrHist.slice(-50);
                    assetsData[symbol].atr_1H = atrHist.at(-1) || 0;
                    assetsData[symbol].currentVolume = c1H.at(-1).volume;
                    const bb = indicadores.calculateBB(assetsData[symbol], 20, 2);
                    assetsData[symbol].bbWidth = bb.bbWidth;
                }
                if (assetsData[symbol].candles1H.length > 0 && candleCharts[symbol]) {
                    const lastCandle = assetsData[symbol].candles1H.at(-1);
                    if (lastCandle) {
                        graficos.updateCandle(candleCharts[symbol], lastCandle);
                    }
                }
            }
            await evaluateMarkets();
        }, 300000);

        setInterval(updateTimestamps, 1000);

        // Botão Telegram
        document.getElementById('test-telegram-btn').addEventListener('click', async function(e) {
            this.disabled = true;
            document.getElementById('test-btn-label').innerHTML = '<span class="spinner"></span> Enviando...';
            const ok = await telegram.sendTelegramAlert('🔔 <b>TESTE DE CONEXÃO V2 - Motor Institucional Ativo!</b>\n⚛️ SMC + MTF + Orderflow + Trailing Stop + Comitê\n⏰ ' + getCurrentTimestamp());
            document.getElementById('test-btn-label').textContent = ok ? '✅ Enviado!' : '❌ Falha';
            setTimeout(() => { document.getElementById('test-btn-label').textContent = '📨 Testar Alerta'; this.disabled = false; }, 3000);
        });
    }

    // ===== Início =====
    init();

    // Resize dos candles
    window.addEventListener('resize', () => {
        // Será implementado se necessário
    });
